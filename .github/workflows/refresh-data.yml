# Refresh the published data without anyone doing it.
#
# PLAN.md 8.1: shipping a new number is a data publish, not a release. The app
# fetches a manifest on launch and takes a new bundle when one exists, so this
# job is the only thing standing between a new Visa Bulletin and every user
# seeing it. Before this existed, every dataset in the repository had been built
# by hand, which meant the app would have gone quietly stale within a month.
#
# Daily, because the bulletin's publication day drifts by a week or more and
# polling daily catches it within 24 hours without needing to model the window.
# Also on demand, which is the button to press when something is known to have
# changed.
#
# The heavy annual sources, labour certifications and visa issuance, are NOT
# here. They change once a year and cost most of a gigabyte to download. They
# live in refresh-annual.yml.

name: Refresh data

on:
  schedule:
    # 15:00 UTC daily. The Visa Office publishes during the US working day, so
    # this lands after a morning release rather than just before one.
    - cron: "0 15 * * *"
  workflow_dispatch:
  # A hand edit to the event registry has to reach people, and until now it
  # did not. This workflow is the only thing that deploys Pages, and it ran
  # on the clock alone, so an entry added at 22:04 sat invisible until the
  # next afternoon while the repository looked up to date and nothing
  # reported a problem. That is the opposite of what the registry is for:
  # watch-feeds deliberately leaves the judgement to a person, and a person's
  # judgement was then held for a day by a cron.
  #
  # Scoped to the files a person actually edits by hand. This job commits
  # data/ on most runs, so a broad data/** filter would retrigger it in a
  # loop; it never writes events.json or anything under web/, so these two
  # cannot feed back into it.
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "web/**"
      # A bulletin imported by hand (pipeline/import_bulletin.py). The build
      # reads these but never writes them, so this cannot loop either.
      - "data/bulletin-pages/**"

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes race for the same commit or the same Pages deploy.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Full history: the commit step rebases when another workflow pushes
      # first, and a rebase needs more than the default shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Without this every run re-fetches 200 bulletins from a government
      # server that has no obligation to tolerate it. With it, a run fetches
      # only the months it has not seen.
      - name: Restore the fetch cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: |
            fetch-cache-

      - run: pip install -r pipeline/requirements.txt

      # Kept aside before anything overwrites it, so publish.py can refuse a
      # bundle that went backwards.
      - name: Keep the current bundle for comparison
        run: cp data/app-bundle.json /tmp/previous-bundle.json

      # How a new bulletin arrives now. No State Department channel serves it
      # to a program any more; this dataset is entered by a person from the
      # official page, so a bot block does not stop it (pipeline/gceta/vbcn.py).
      # Never fails the run; check_freshness.py notices if it stops updating.
      - name: Pull new months from the visa-bulletin-cn dataset
        run: python pipeline/sync_visa_bulletin_cn.py

      - name: Fetch the bulletin archive
        run: python pipeline/build_bulletins.py

      # The source no longer serves any bulletin, so the fetch cache was the
      # only copy of the archive; this copies anything in it that is not yet
      # committed into data/bulletin-pages/, which the commit step below keeps.
      - name: Keep cached bulletins in the repository
        run: python pipeline/archive_cached_pages.py

      - name: Re-read the annual limits from the archive
        run: python pipeline/build_limits.py

      # Before the bundle, because the bundle folds it in. USCIS publishes
      # only the current month, so this has to run while that month is up:
      # a month missed is a month lost, not one that can be fetched later.
      # Allowed to fail the run -- a silent gap here is how the app would go
      # back to hedging without anyone noticing.
      - name: Record which filing chart USCIS designated this month
        run: python pipeline/build_chart_determination.py

      - name: Rebuild the app bundle
        run: python pipeline/build_app_bundle.py

      # This is the step that is allowed to stop the run. A refresh that
      # succeeds quietly on bad data is worse than one that fails, because the
      # app takes what it is given.
      - name: Validate and stage for publishing
        run: python pipeline/publish.py --out public/data --previous /tmp/previous-bundle.json

      - name: Commit the refreshed data
        id: commit
        run: >
          .github/scripts/commit-and-push.sh
          "Refresh data: bulletin through $(python -c 'import json;print(json.load(open("data/app-bundle.json"))["end_month"])')"
          data/

      # Static pages committed to the repo (privacy policy, etc.) rather than
      # generated by this pipeline. Copied alongside the data on every run so
      # the two never need separate deploys, and a page like the privacy
      # policy a store submission links to can't go stale or 404 just because
      # a data refresh happened without a matching site deploy.
      - name: Add the static site pages
        run: cp web/*.html public/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Separate from build so a stale bulletin turns the run red without holding
  # back the Pages deploy, which also carries hand edits to the event registry.
  # Since Nov 2026 no new bulletin arrives on its own (pipeline/gceta/pages.py),
  # so this is the only thing that notices when one is due. Warns from the 25th,
  # fails from the 1st of the month whose bulletin is missing.
  freshness:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the bulletin is current
        run: python3 pipeline/check_freshness.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Deployed on every successful run even when nothing changed, so the
      # published files can never drift from the repository.
      - id: deploy
        uses: actions/deploy-pages@v4
