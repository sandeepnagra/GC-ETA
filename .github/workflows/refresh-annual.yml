# The sources that change once a year and cost most of a gigabyte to read.
#
# Labor certification disclosure files run 60 to 90 MB each and the visa
# issuance tables are a PDF per fiscal year. Neither changes between releases,
# so running them daily would download hundreds of megabytes to produce an
# identical file. Monthly is frequent enough to notice a new publication within
# weeks, and the button is here for when one is known to be out.
#
# This deliberately does not deploy. It commits the refreshed source data, and
# the daily job publishes it on its next run, so there is exactly one code path
# that puts files in front of users.

name: Refresh annual sources

on:
  schedule:
    # 04:00 UTC on the 3rd of each month, away from the daily job.
    - cron: "0 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-annual
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history: the commit step rebases when another workflow pushes
      # first, and a rebase needs more than the default shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Shared with the daily job, which is what keeps the archive build below
      # down to the month or two this runner has not already seen.
      - name: Restore the fetch cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: |
            fetch-cache-

      - run: pip install -r pipeline/requirements.txt

      # Kept aside before the rebuild overwrites it. The validate step below
      # compares against this: pointed at data/app-bundle.json after the
      # rebuild, as it was, it compared the new bundle with itself and the
      # "went backwards" guard could never fire.
      - name: Keep the current bundle for comparison
        run: cp data/app-bundle.json /tmp/previous-bundle.json

      # Both scripts are resumable and skip years they already hold, so a run
      # that adds nothing is cheap and a run that adds a year is the only one
      # that pays for the download.
      - name: Labour certification density
        run: python pipeline/build_perm_density.py

      - name: Visa issuance from the Report of the Visa Office
        run: python pipeline/build_issuance.py

      # build_app_bundle.py reads data/bulletins.json, and that file is
      # gitignored -- 6 MB of parsed archive, reproducible from here, so it is
      # never committed. The daily job builds it before using it; this one did
      # not, so every run of this workflow died on FileNotFoundError the moment
      # it reached the bundle step. Cheap with the cache restored above: the
      # months are already there, so this re-parses rather than re-downloads.
      - name: Rebuild the bulletin archive the bundle is built from
        run: python pipeline/build_bulletins.py

      # Built to prove the new annual data produces a good bundle, then
      # thrown away: see the commit step for why it is not committed here.
      - name: Rebuild the app bundle
        run: python pipeline/build_app_bundle.py

      - name: Validate
        run: python pipeline/publish.py --out /tmp/check --previous /tmp/previous-bundle.json

      # Only this job's own products -- the two annual source files. The
      # bundle rebuilt above is deliberately left behind.
      #
      # It used to commit all of data/, which meant this job and the daily one
      # both wrote data/app-bundle.json. Run them together and they conflict
      # on it for real, which is what happened here: two regenerations of the
      # same file differing by a timestamp is not something a rebase can or
      # should resolve. It also contradicted this workflow's own promise at
      # the top of the file -- commit the source data, let the daily job
      # publish it, one code path in front of users. The daily job rebuilds
      # the bundle from these files within the day anyway.
      - name: Commit if anything changed
        run: >
          .github/scripts/commit-and-push.sh
          "Refresh annual sources: labour certifications and visa issuance"
          data/perm-density.json data/issuance.json
